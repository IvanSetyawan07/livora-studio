<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Identity Services -->
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>

    <!-- Primary SEO -->
    <title>LIVORA | Interior Design & Custom Furniture Jakarta</title>

    <meta
      name="description"
      content="LIVORA is a Jakarta-based interior design and custom furniture studio for homes, apartments, villas, offices, and commercial spaces."
    />

    <meta name="author" content="LIVORA" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.livoralcr.com/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LIVORA" />

    <meta
      property="og:title"
      content="LIVORA | Interior Design & Custom Furniture Jakarta"
    />

    <meta
      property="og:description"
      content="LIVORA is a Jakarta-based interior design and custom furniture studio for homes, apartments, villas, offices, and commercial spaces."
    />

    <meta
      property="og:url"
      content="https://www.livoralcr.com/"
    />

    <meta
      property="og:image"
      content="https://www.livoralcr.com/og-livora.jpg"
    />

    <meta
      property="og:image:alt"
      content="LIVORA interior design project"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="LIVORA | Interior Design & Custom Furniture Jakarta"
    />

    <meta
      name="twitter:description"
      content="LIVORA is a Jakarta-based interior design and custom furniture studio for homes, apartments, villas, offices, and commercial spaces."
    />

    <meta
      name="twitter:image"
      content="https://www.livoralcr.com/og-livora.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="LIVORA interior design project"
    />

    <!-- Site Icon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
